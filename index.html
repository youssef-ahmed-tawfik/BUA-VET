<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#173f3b">
  <title>VET BUA</title>
  <style>
    :root{--green:#173f3b;--green2:#2e6658;--paper:#faf9f5;--ink:#202a28;--muted:#707a74;--line:#e2e5dd;--soft:#edf2ed;--gold:#c78c43;--red:#9d4739;--shadow:0 12px 30px #193b3210}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.75 Tahoma,Arial,sans-serif}button,input{font:inherit}button{cursor:pointer}.top{background:var(--green);color:white;height:72px;position:sticky;top:0;z-index:5;box-shadow:0 3px 14px #10262020}.top-inner,.main-inner,.footer-inner{width:min(1120px,calc(100% - 34px));margin:auto}.top-inner{height:100%;display:flex;justify-content:space-between;align-items:center}.brand{display:flex;align-items:center;gap:11px;color:white;text-decoration:none}.mark{width:37px;height:37px;border:1px solid #ffffff70;border-radius:50%;display:grid;place-items:center;font:15px Georgia,serif;letter-spacing:-1px}.name{font:700 21px Georgia,serif;letter-spacing:1.4px}.admin-link{color:white;text-decoration:none;border:1px solid #ffffff55;padding:7px 12px;border-radius:7px;font-size:13px}.admin-link:hover{background:#ffffff15}main{min-height:calc(100vh - 130px)}.main-inner{padding:34px 0 70px}.heading{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-bottom:19px}.heading h1,.heading h2{font-size:22px;color:var(--green);margin:0}.search{border:1px solid var(--line);background:white;border-radius:8px;padding:9px 12px;width:min(310px,100%);outline:none}.search:focus{border-color:var(--green2);box-shadow:0 0 0 3px #2e665818}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.subject{display:block;text-align:right;background:white;border:1px solid var(--line);border-radius:10px;padding:17px 19px;color:var(--ink);text-decoration:none;transition:.16s;box-shadow:0 2px 5px #162a2406}.subject:hover{transform:translateY(-2px);border-color:#b8ccc0;box-shadow:var(--shadow)}.subject-top{display:flex;justify-content:space-between;color:#a0a8a0;font:14px Georgia,serif;margin-bottom:7px}.subject-ar{display:block;font-weight:bold;font-size:17px;color:var(--green)}.subject-en{display:block;color:var(--muted);font-size:12px;direction:ltr;text-align:right}.subject-count{display:block;margin-top:5px;color:#7e8881;font-size:12px}.crumb{font-size:13px;color:var(--muted);margin-bottom:18px}.crumb button{border:0;background:none;padding:0;color:var(--green2)}.list{display:grid;gap:9px}.lecture{width:100%;display:flex;justify-content:space-between;align-items:center;text-align:right;background:white;border:1px solid var(--line);border-radius:9px;padding:12px 16px;color:var(--ink)}.lecture:hover{border-color:#b8ccc0}.lecture-title{font-weight:bold;color:var(--green)}.lecture-meta{font-size:12px;color:var(--muted)}.arrow{color:var(--gold);font-size:18px}.empty{border:1px dashed #cbd3cb;border-radius:9px;background:#ffffffaa;text-align:center;padding:28px;color:var(--muted)}.empty strong{display:block;color:var(--green);margin-bottom:4px}.lesson-head{border-bottom:1px solid var(--line);padding-bottom:17px;margin-bottom:20px}.lesson-head h1{color:var(--green);font-size:29px;margin:2px 0}.lesson-sub{color:var(--muted);font-size:13px}.block{background:white;border:1px solid var(--line);border-radius:9px;padding:18px 20px;margin:14px 0}.block h2{font-size:18px;color:var(--green);margin:0 0 12px}.html-frame,.pdf-frame{width:100%;height:min(72vh,740px);border:1px solid var(--line);border-radius:7px;background:#fff}.resource-list{display:flex;flex-wrap:wrap;gap:8px}.resource{background:var(--soft);padding:7px 11px;border-radius:6px;text-decoration:none;font-size:13px}.question{border-top:1px solid var(--line);padding:14px 0}.question:first-of-type{border:0}.q-title{font-weight:bold;margin-bottom:8px}.choice{display:flex;gap:9px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:6px;margin:7px 0;cursor:pointer}.choice:has(input:checked){background:#f2f7f2;border-color:#a8beb0}.check{background:var(--green);color:#fff;border:0;padding:7px 12px;border-radius:6px;font-size:13px}.feedback{display:inline-block;margin-inline-start:9px;padding:4px 9px;border-radius:6px;font-size:12px}.good{background:#e9f3eb;color:#2a6543}.bad{background:#f9ece8;color:#9d4739}.footer{border-top:1px solid var(--line);color:#748078;font-size:12px;padding:17px 0}.footer-inner{display:flex;justify-content:space-between}.loading{color:var(--muted);padding:30px 0}
    @media(max-width:760px){.grid{grid-template-columns:repeat(2,1fr)}.heading{align-items:flex-start;flex-direction:column}.search{width:100%}}
    @media(max-width:520px){.top{height:64px}.top-inner,.main-inner,.footer-inner{width:calc(100% - 26px)}.main-inner{padding-top:23px}.grid{grid-template-columns:1fr;gap:9px}.subject{padding:14px 16px}.name{font-size:19px}.admin-link{padding:6px 9px;font-size:12px}.lesson-head h1{font-size:24px}.block{padding:14px}.footer-inner{flex-direction:column;gap:3px}}
  </style>
</head>
<body>
<header class="top"><div class="top-inner"><a class="brand" href="./" aria-label="VET BUA"><span class="mark">VB</span><span class="name">VET BUA</span></a><a class="admin-link" href="https://app.pagescms.org/" target="_blank" rel="noopener">إدارة المحتوى ↗</a></div></header>
<main><div class="main-inner" id="app"><div class="loading">جاري تحميل المواد…</div></div></main>
<footer class="footer"><div class="footer-inner"><span>VET BUA</span><span></span></div></footer>
<script>
const SUBJECTS=[
{id:'internal-medicine',ar:'الباطنة',en:'Internal Medicine'},
{id:'toxicology',ar:'السموم',en:'Toxicology'},
{id:'meat',ar:'اللحوم',en:'Meat Hygiene and Inspection'},
{id:'poultry',ar:'الدواجن',en:'Poultry Diseases'},
{id:'dairy',ar:'الألبان',en:'Dairy Hygiene and Inspection'},
{id:'infectious-diseases',ar:'الأمراض المعدية',en:'Infectious Diseases'},
{id:'transboundary-diseases',ar:'الأمراض العابرة للحدود',en:'Transboundary Diseases'}
];
let lectures=[];
const app=document.getElementById('app');
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const subject=id=>SUBJECTS.find(item=>item.id===id)||{ar:'مادة',en:''};
async function start(){try{const response=await fetch('./data/lectures.json',{cache:'no-store'});if(!response.ok)throw new Error('تعذر تحميل قائمة المحاضرات.');lectures=await response.json();if(!Array.isArray(lectures))lectures=[];renderHome()}catch(error){app.innerHTML='<div class="empty"><strong>تعذر تحميل الموقع</strong>راجع إعداد ملفات البيانات بعد النشر.</div>'}}
function renderHome(){const counts=Object.fromEntries(SUBJECTS.map(item=>[item.id,lectures.filter(lecture=>lecture.subjectId===item.id).length]));app.innerHTML=`<div class="heading"><h1>المواد الدراسية</h1><input class="search" id="search" placeholder="ابحث عن مادة…" oninput="filterSubjects(this.value)"></div><div class="grid" id="subjects">${SUBJECTS.map((item,index)=>`<a class="subject" data-search="${esc((item.ar+' '+item.en).toLowerCase())}" href="#subject/${item.id}"><span class="subject-top"><span>0${index+1}</span><span class="arrow">←</span></span><span class="subject-ar">${esc(item.ar)}</span><span class="subject-en">${esc(item.en)}</span><span class="subject-count">${counts[item.id]||0} محاضرة</span></a>`).join('')}</div>`}
function filterSubjects(value){const query=value.trim().toLowerCase();document.querySelectorAll('.subject').forEach(card=>card.hidden=!card.dataset.search.includes(query))}
function renderSubject(id){const item=subject(id),items=lectures.filter(lecture=>lecture.subjectId===id).sort((a,b)=>(Number(a.sort)||0)-(Number(b.sort)||0));app.innerHTML=`<div class="crumb"><button onclick="goHome()">المواد الدراسية</button>　/　${esc(item.ar)}</div><div class="heading"><div><h1>${esc(item.ar)}</h1><div class="subject-en">${esc(item.en)}</div></div><span class="lecture-meta">${items.length} محاضرة</span></div>${items.length?`<div class="list">${items.map(lecture=>`<button class="lecture" onclick="location.hash='lesson/${encodeURIComponent(lecture.id)}'"><span><span class="lecture-title">${esc(lecture.title)}</span><span class="lecture-meta" style="display:block">${lecture.htmlFile?'شرح · ':''}${lecture.pdfUrl?'PDF · ':''}${(lecture.questions||[]).length} سؤال</span></span><span class="arrow">←</span></button>`).join('')}</div>`:'<div class="empty"><strong>المحاضرات ستضاف هنا</strong>لا توجد محاضرات في هذه المادة حتى الآن.</div>'}`}
function drivePreview(url){if(!url)return '';const value=String(url),file=value.match(/drive\.google\.com\/file\/d\/([^/]+)/),id=value.match(/[?&]id=([^&]+)/);if(file)return `https://drive.google.com/file/d/${file[1]}/preview`;if(id&&value.includes('drive.google.com'))return `https://drive.google.com/file/d/${id[1]}/preview`;return value}
function renderLesson(id){const lecture=lectures.find(item=>String(item.id)===String(id));if(!lecture){goHome();return}const item=subject(lecture.subjectId),html=lecture.htmlFile?`<section class="block"><h2>شرح المحاضرة</h2><iframe class="html-frame" sandbox="allow-scripts" src="${esc(lecture.htmlFile)}" title="شرح ${esc(lecture.title)}"></iframe></section>`:'';const preview=drivePreview(lecture.pdfUrl);const pdf=preview?`<section class="block"><h2>ملف المحاضرة</h2><iframe class="pdf-frame" loading="lazy" src="${esc(preview)}" title="ملف PDF"></iframe><p><a href="${esc(lecture.pdfUrl)}" target="_blank" rel="noopener">فتح الملف في Google Drive</a></p></section>`:'';const links=(lecture.links||[]).filter(link=>link.title&&link.url);const resources=links.length?`<section class="block"><h2>مصادر إضافية</h2><div class="resource-list">${links.map(link=>`<a class="resource" href="${esc(link.url)}" target="_blank" rel="noopener">↗ ${esc(link.title)}</a>`).join('')}</div></section>`:'';const questions=(lecture.questions||[]).filter(q=>q.prompt&&q.options&&q.options.length);const quiz=questions.length?`<section class="block"><h2>اختبر فهمك</h2>${questions.map((q,index)=>`<div class="question"><div class="q-title">${index+1}. ${esc(q.prompt)}</div>${q.options.map((choice,n)=>`<label class="choice"><input type="radio" name="q${index}" value="${n}"><span>${esc(choice)}</span></label>`).join('')}<button class="check" data-explanation="${esc(q.explanation||'')}" onclick="checkAnswer(${index},${Number(q.answer||1)-1},this.dataset.explanation)">تحقق من الإجابة</button><span class="feedback" id="fb${index}" hidden></span></div>`).join('')}</section>`:'';app.innerHTML=`<div class="crumb"><button onclick="goHome()">المواد الدراسية</button>　/　<button onclick="location.hash='subject/${item.id}'">${esc(item.ar)}</button>　/　${esc(lecture.title)}</div><header class="lesson-head"><div class="lesson-sub">${esc(item.ar)} · <span dir="ltr">${esc(item.en)}</span></div><h1>${esc(lecture.title)}</h1></header>${html}${pdf}${resources}${quiz}${!(html||pdf||resources||quiz)?'<div class="empty">لم تتم إضافة محتوى لهذه المحاضرة بعد.</div>':''}`}
function checkAnswer(index,correct,explanation){const selected=document.querySelector(`input[name="q${index}"]:checked`),feedback=document.getElementById('fb'+index);feedback.hidden=false;if(!selected){feedback.className='feedback bad';feedback.textContent='اختر إجابة أولًا.';return}if(Number(selected.value)===correct){feedback.className='feedback good';feedback.textContent='إجابة صحيحة.'+(explanation?' '+explanation:'')}else{feedback.className='feedback bad';feedback.textContent='الإجابة غير صحيحة.'+(explanation?' '+explanation:'')}}
function goHome(){location.hash=''}
function route(){const value=decodeURIComponent(location.hash.slice(1)),parts=value.split('/');if(parts[0]==='subject'&&parts[1])renderSubject(parts[1]);else if(parts[0]==='lesson'&&parts[1])renderLesson(parts[1]);else renderHome()}
window.addEventListener('hashchange',route);
start();
</script>
</body>
</html>
